name: Build debug APK

# 只做一件事：在 x86_64 runner 上产出可安装的 debug APK 并作为 artifact 提供下载。
# 不碰签名 secrets、不跑 rootfs/PRoot 工具链、不做发版门禁 —— 目的是让改动（例如根通道
# 支持任意 su 实现）能被装到真机上验证。正式发版仍走 android-build.yml。
#
# 为什么必须有 x86_64：AGP 的 aapt2 只发布 linux-x86_64 版（ELF e_machine = 0x3e），
# 在 aarch64 主机上连配置阶段都过不去。参见 docs/mobile-acceptance-checklist.md S-Shell-4。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '0.4.6'

jobs:
  debug-apk:
    name: assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # 该 action 默认装 `tools platform-tools`，而 SDK 源已下架 `tools`，
          # 默认值会让 sdkmanager 以 "Failed to find package 'tools'" 退出。
          packages: 'platform-tools'

      - name: Install SDK packages
        # SDK 源已移除 `tools` 包，只装实际需要的四项；版本与 android/app/build.gradle
        # 的 compileSdk 35 / ndkVersion 27.1.12297006 对齐。
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.1.12297006"

      # 构建期会校验 legal 资产与插件脚本的源文件，这些都来自仓库自身的 node_modules
      # 与 scripts/runtime-profile，必须在 gradle 配置阶段之前就位。
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Shizuku plugin dependencies
        run: pnpm --dir scripts/runtime-profile install --frozen-lockfile --ignore-scripts

      - name: Build harness-web submodule
        run: |
          set -euo pipefail
          if [ -f harness-web/package.json ]; then
            pnpm --dir harness-web install --frozen-lockfile || pnpm --dir harness-web install
            pnpm --dir harness-web run build
          else
            echo "harness-web 子模块未就绪，跳过（debug APK 不依赖其 dist）"
          fi

      # 仓库只带 wrapper 的 properties，jar 由可信 gradle 发行版现场生成（供应链引导），
      # 与 android-build.yml 的做法一致；不要改为提交第三方 jar。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1
        with:
          gradle-version: 8.11.1

      - name: Generate Gradle wrapper
        working-directory: .wrapper-bootstrap
        run: gradle wrapper --no-daemon

      - name: Install wrapper jar into android project
        run: |
          set -euo pipefail
          mkdir -p android/gradle/wrapper
          cp .wrapper-bootstrap/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          ls -l android/gradle/wrapper/

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          out="android/app/build/outputs/apk/debug"
          ls -lh "$out"
          mkdir -p dist
          cp "$out"/*.apk dist/

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-debug-apk
          path: dist/*.apk
          if-no-files-found: error
